version: pilot-v0
created: '2026-10-26'
source_dataset: FreshBrew data/migration_datasets/full_dataset.yaml + cov_data.csv
selection_rule: Single-module Java 8 Maven repos with >= 10 tests run; two per size
  stratum (S/M/L by LOC, est_output_tokens = LOC x 10) for the single-shot and agentic
  arms; ten small-to-medium repos (B) for the agentic breadth sample.
default_limits:
  single_shot:
    cost_usd: 9.0
    tokens: 1500000
    messages: 4
    time_s: 5400
  agentic:
    cost_usd: 5.0
    tokens: 2000000
    messages: 120
    time_s: 3600
