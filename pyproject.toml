[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legacybench"
version = "0.0.1"
description = "Pre-registered pilot harness for evaluating frontier models on legacy software modernization"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "inspect-ai>=0.3.280",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["legacybench*"]

[tool.setuptools.package-data]
legacybench = ["prices.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
